  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ink);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { font-family: 'Playfair Display', serif; }

  /* ── UTILITIES ── */
  .em { color: var(--em); }
  .muted { color: var(--muted); }
  .soft { color: var(--soft); }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 28px; }
  .gradient-text {
    background: linear-gradient(135deg, #fff 0%, var(--em) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .card {
    background: rgba(20,27,36,0.65);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .card-em {
    background: rgba(20,27,36,0.65);
    border: 1px solid var(--border-em);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 13px 26px; border-radius: 100px;
    background: linear-gradient(90deg, var(--em) 0%, #a8f0d0 50%, var(--em) 100%);
    background-size: 200% auto;
    animation: shimmer 3s linear infinite;
    color: var(--ink); font-weight: 600; font-size: 14px;
    border: none; cursor: pointer; text-decoration: none;
    transition: transform .25s, box-shadow .25s;
  }
  .btn-primary:hover { transform: scale(1.04); box-shadow: 0 0 30px var(--em-glow); }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 13px 26px; border-radius: 100px;
    background: transparent; color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); font-size: 14px;
    cursor: pointer; text-decoration: none;
    transition: border-color .25s, background .25s, transform .25s;
  }
  .btn-outline:hover { border-color: var(--border-em); background: var(--em-glow2); transform: scale(1.02); }
  .section-label {
    display: inline-block;
    font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
    color: var(--em); margin-bottom: 14px;
  }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); }
  .star-row { display: flex; gap: 2px; }
  .star-row span { color: var(--em); font-size: 13px; }
  .check-item { display: flex; align-items: center; gap: 10px; }
  .check-circle {
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(0,224,150,0.1); border: 1px solid rgba(0,224,150,0.3);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .check-circle svg { width: 9px; height: 9px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 13px; border-radius: 100px;
    border: 1px solid rgba(0,224,150,0.22); background: rgba(0,224,150,0.06);
    font-size: 12px; color: var(--em);
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--em); animation: blink 2s ease-in-out infinite; }
  .bubble-wrap { display: flex; margin-bottom: 8px; }
  .bubble-wrap.right { justify-content: flex-end; }
  .bubble-client {
    max-width: 74%; padding: 8px 12px; font-size: 12px; line-height: 1.5;

  }
  .bubble-bot {
    max-width: 74%; padding: 8px 12px; font-size: 12px; line-height: 1.5;
    background: var(--surf2); color: var(--text);
    border-radius: 14px 14px 14px 2px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* ── KEYFRAMES ── */
  @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes pulseGlow { 0%,100%{box-shadow:0 0 24px var(--em-glow2)} 50%{box-shadow:0 0 50px var(--em-glow),0 0 90px var(--em-glow2)} }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .animate-float { animation: float 4s ease-in-out infinite; }
  .animate-pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }

  /* ── NAVBAR ── */
  #navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;

  }
  #navbar.scrolled {
    padding: 12px 0; background: rgba(8,11,15,0.88);

  .nav-inner { display: flex; align-items: center; justify-content: space-between; }
  .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .nav-logo-icon {
    width: 28px; height: 28px; border-radius: 8px; background: var(--em);

  .nav-logo-icon svg { width: 14px; height: 14px; fill: var(--ink); }

<script>
  // Pricing tab switch — highlight active tab, all cards always visible
  function switchPlan(plan, btn) {
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    // Highlight the corresponding card with a subtle ring
    document.querySelectorAll('.plan-card').forEach(c => {
      c.style.outline = 'none';
      c.style.outlineOffset = '0';
    });
    const target = document.getElementById('plan-' + plan);
    if (target) {
      target.style.outline = '2px solid rgba(0,224,150,0.5)';
      target.style.outlineOffset = '3px';
      target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
    // Clear highlight after 1.8s
    setTimeout(() => {
      if (target) { target.style.outline = 'none'; }
    }, 1800);
  }

  // Navbar scroll effect
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 40);
  });

  // Mobile menu
  function toggleMenu() {
    document.getElementById('mobile-menu').classList.toggle('open');
  }
  function closeMenu() {
    document.getElementById('mobile-menu').classList.remove('open');
  }

  // Scroll reveal
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
  }, { threshold: 0.12 });
  reveals.forEach(el => observer.observe(el));

  // Chat animation
  const messages = [
    { from: 'client', text: 'Hola, ¿tenéis hueco esta semana?' },
    { from: 'bot',    text: '¡Hola! Claro 😊 ¿Para qué servicio te gustaría reservar?' },
    { from: 'client', text: 'Limpieza facial y masaje de espalda' },
    { from: 'bot',    text: 'Perfecto. Tengo disponible el jueves 24 a las 17:00h. ¿Te va bien?' },
    { from: 'client', text: '¡Sí, perfecto!' },
    { from: 'bot',    text: '✅ ¡Cita confirmada! Te esperamos el jueves 24 a las 17:00h. Recibirás un recordatorio 24h antes.' },
  ];
  const chatBody = document.getElementById('chat-body');
  let idx = 0;
  function addMessage() {
    if (idx >= messages.length) { setTimeout(() => { chatBody.innerHTML=''; idx=0; setTimeout(addMessage,800); }, 3000); return; }
    const m = messages[idx++];
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap' + (m.from==='client' ? ' right' : '');
    const bubble = document.createElement('div');
    bubble.className = m.from==='client' ? 'bubble-client' : 'bubble-bot';
    bubble.textContent = m.text;
    bubble.style.opacity = '0';
    bubble.style.transform = 'translateY(8px)';
    bubble.style.transition = 'all .35s ease';
    wrap.appendChild(bubble);
    chatBody.appendChild(wrap);
    chatBody.scrollTop = chatBody.scrollHeight;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bubble.style.opacity = '1';
      bubble.style.transform = 'translateY(0)';
    }));
    setTimeout(addMessage, 900 + Math.random()*400);
  }
  setTimeout(addMessage, 1200);
</script>

   ═══════════════════════════════════════════════════════════ */

const API_BASE = 'https://remarkable-emotion-production-605f.up.railway.app'; // Backend Railway

  /* ─── AUTH ─── */
  async register(data) {

      const res = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || 'Error al crear la cuenta');
      return json;
    }
    // Firebase directo (sin backend)
    if (OmniraDB.isFirebaseReady()) {
      const userData = {
        businessName: data.businessName,
        phone: data.phone || '',
        plan: 'free', botActive: false, status: 'active',
      };
      return await OmniraDB.firebaseRegister(data.email.toLowerCase().trim(), data.password, userData);
    }
    // Fallback local encriptado
    const norm = data.email.toLowerCase().trim();
    const existing = await OmniraDB.getUserByEmail(norm);
    if (existing) throw new Error('Ese email ya está registrado. ¿Quieres iniciar sesión?');
    const user = {
      id: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      businessName: data.businessName, email: norm,
      phone: data.phone || '', plan: 'free', botActive: false,
      status: 'active', createdAt: new Date().toISOString()
    };
    await OmniraDB.saveUser(user);
    return { user: this._pub(user), token: 'local-' + user.id };
  },

  async login(email, password) {
    if (API_BASE) {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || 'Email o contraseña incorrectos');
      return json;
    }
    if (OmniraDB.isFirebaseReady()) {
      return await OmniraDB.firebaseLogin(email.toLowerCase().trim(), password);
    }
    const norm = email.toLowerCase().trim();
    const exists = await OmniraDB.getUserByEmail(norm);
    if (!exists) throw new Error('No existe ninguna cuenta con ese email.');
    const storedPass = await OmniraDB.getUserPassword(exists.id) || exists.password;
    if (storedPass !== password) throw new Error('Contraseña incorrecta.');
    return { user: this._pub(exists), token: 'local-' + exists.id };
  },

  async getMe() {
    if (API_BASE) {
      const res = await fetch(`${API_BASE}/api/auth/me`, { headers: this._h() });
      if (!res.ok) throw new Error('Sesión expirada');
      return res.json();
    }
    const session = JSON.parse(localStorage.getItem('omnira_session') || '{}');
    if (!session.user) throw new Error('No hay sesión');
    if (OmniraDB.isFirebaseReady()) {
      const fresh = await OmniraDB.getUserById(session.user.id);

        body: JSON.stringify({ email })
      });

      if (!res.ok) throw new Error(json.message || 'Error al enviar el email');
      return json;
    }
    // Fallback: Firebase directo
    if (OmniraDB.isFirebaseReady && OmniraDB.isFirebaseReady()) {
      try {
        await OmniraDB.firebaseResetPassword(email);
        return { message: 'Email enviado' };

        throw new Error('Error al enviar el email. Inténtalo de nuevo.');
      }
    }
    // Fallback local
    const user = await OmniraDB.getUserByEmail(email.toLowerCase().trim());

      const check = await this.canAddEvent(user);
      if (!check.ok) throw new Error(`Has alcanzado el límite de ${check.limit} reservas/mes del plan gratuito.`);
    }
    if (API_BASE) {
      const method = ev.id ? 'PUT' : 'POST';
      const url = ev.id ? `${API_BASE}/api/events/${ev.id}` : `${API_BASE}/api/events`;
      const res = await fetch(url, { method, headers: this._h(), body: JSON.stringify(ev) });
      const json = await res.json();
      if (!res.ok) {
        if (json.limitReached) throw new Error(json.message);
        throw new Error(json.message || 'Error al guardar la reserva');
      }
      return json;
    }
    return await OmniraDB.saveEvent(this._uid(), ev);

  },

  async canAddEvent(user) {
    const plan = user?.plan || 'free';
    const limit = PLAN_LIMITS[plan] || 30;
    if (limit === Infinity) return { ok: true };
    const events = await this.getEvents();
    const now = new Date();
    const count = events.filter(e => {
      const d = new Date(e.datetime || e.createdAt);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear() && e.source === 'manual';
    }).length;
    return { ok: count < limit, count, limit };
  },

  async getMonthlyEventCount(user) {
    const res = await this.canAddEvent(user);
    return res.count || 0;
  },

  /* ─── NEGOCIO ─── */
  async getBusiness() {

  /* ─── BOT ─── */
  async getBot() {
    if (API_BASE) { const r = await fetch(`${API_BASE}/api/bot`, { headers: this._h() }); return r.json(); }
    return await OmniraDB.getBot(this._uid());

      if (!r.ok) throw new Error('Error al guardar');
      return r.json();
    }
    await OmniraDB.saveBot(this._uid(), data);
    return { success: true };

  /* ─── HELPERS ─── */
  _h() {
    const s = JSON.parse(localStorage.getItem('omnira_session') || '{}');

  },
  _uid() {
    const s = JSON.parse(localStorage.getItem('omnira_session') || '{}');
    return s.user?.id || 'anon';
  },
  _pub(u) { const { password, ...pub } = u; return pub; }
};

let calCurrent = new Date();
calCurrent.setDate(1);

const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

async function renderCalendar(){
  const year = calCurrent.getFullYear();
  const month = calCurrent.getMonth();
  document.getElementById('calMonth').textContent = `${MONTHS_ES[month]} ${year}`;

  const events = await panelApi.getEvents();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Primer día del mes (lunes=0, ..., domingo=6)
  const firstDay = new Date(year, month, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();

  // Días vacíos del mes anterior
  for (let i=0; i<offset; i++) {
    const div = document.createElement('div');
    div.className = 'cal-day empty';
    grid.appendChild(div);
  }
  // Días del mes
  for (let d=1; d<=daysInMonth; d++) {
    const div = document.createElement('div');
    div.className = 'cal-day';
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
    if (isToday) div.classList.add('today');

    const dayEvents = events.filter(e => {
      const ed = new Date(e.datetime);
      return ed.getFullYear()===year && ed.getMonth()===month && ed.getDate()===d;
    });
    if (dayEvents.length) div.classList.add('has-events');

    let html = `<div class="cal-day-num">${d}</div>`;
    html += '<div class="cal-events">';
    const visible = dayEvents.slice(0,2);
    visible.forEach(e => {
      const time = new Date(e.datetime).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      const cls = e.source === 'manual' ? 'manual' : 'bot';
      html += `<div class="cal-event ${cls}" data-event-id="${e.id}">${time} ${escapeHtml(e.name)}</div>`;
    });
    if (dayEvents.length > 2) html += `<div class="cal-event-more">+${dayEvents.length-2} más</div>`;
    html += '</div>';
    div.innerHTML = html;

    div.addEventListener('click', (ev) => {
      const target = ev.target.closest('.cal-event');
      if (target && target.dataset.eventId) {
        const found = events.find(x => x.id === target.dataset.eventId);
        if (found) openEditEventModal(found);
      } else {
        openAddEventModal(dateStr);
      }
    });
    grid.appendChild(div);
  }
}
function changeCalMonth(delta){
  calCurrent.setMonth(calCurrent.getMonth() + delta);
  renderCalendar();
}
function goToToday(){
  calCurrent = new Date();
  calCurrent.setDate(1);
  renderCalendar();
}

    renderCalendar();
    loadPanelData();
    showPanelToast('Reserva eliminada','success');
  } catch(err) {
    showPanelToast('Error: '+err.message,'error');
  }
}

/* ─── HELPERS ─── */
function showPanelToast(message, type='success'){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast '+type;
  setTimeout(()=>toast.classList.add('visible'), 10);
  setTimeout(()=>toast.classList.remove('visible'), 3500);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ─── RECUPERACIÓN DE CONTRASEÑA ─── */
function showForgotPassword(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('registerScreen').style.display = 'none';
  document.getElementById('forgotScreen').style.display = 'flex';
  document.getElementById('forgotError').classList.remove('visible');
  document.getElementById('forgotSuccess').style.display = 'none';
  document.getElementById('forgotForm').reset();
}

async function handleForgotPassword(e){
  e.preventDefault();
  const btn = document.getElementById('forgotBtn');
  const errBox = document.getElementById('forgotError');
  const okBox = document.getElementById('forgotSuccess');
  errBox.classList.remove('visible');
  okBox.style.display = 'none';
  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div>';

  const email = document.getElementById('forgotEmail').value.toLowerCase().trim();

  try {
    await OmniraDB.sendPasswordReset(email);
    okBox.innerHTML = 'Te hemos enviado un email con el enlace de recuperación. Revisa también la carpeta de spam.';
    okBox.style.display = 'block';
  } catch(err) {
    errBox.textContent = err.message || 'Error al enviar el email. Inténtalo de nuevo.';
    errBox.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* ─── DEEP LINKING: ?panel=login o ?panel=register ─── */
(function checkPanelDeepLink(){
  const params = new URLSearchParams(window.location.search);
  const panel = params.get('panel');
  if (panel === 'login' || panel === 'register') {
    setTimeout(() => openClientPanel(panel), 100);
  }
})();

/* ─── THEME TOGGLE ─── */
function toggleTheme(){
  const isLight = document.documentElement.classList.toggle('light');
  localStorage.setItem('omnira_theme', isLight ? 'light' : 'dark');
}
function initTheme(){
  const saved = localStorage.getItem('omnira_theme');
  if (saved) {
    if (saved === 'light') document.documentElement.classList.add('light');
  } else {
    // Si no hay preferencia guardada, usar la del sistema
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.classList.add('light');
    }
  }
}
initTheme();

/* ─── PLAN + UPGRADE LOGIC ─── */
let currentPanelUser = null;

function updatePlanUI(user) {
  currentPanelUser = user;
  const plan = user?.plan || 'free';
  const isPro = plan === 'pro' || plan === 'Pro';

  // Badge en sidebar
  const badge = document.getElementById('panelPlanBadge');
  if (badge) {
    badge.className = isPro ? 'plan-badge-pro' : 'plan-badge-free';
    badge.innerHTML = `<span class="plan-badge-dot"></span>${isPro ? 'Pro' : 'Gratis'}`;
  }

  // Bot status (solo pro)
  const botBadge = document.getElementById('botStatusBadge');
  if (botBadge) botBadge.style.display = isPro && user.botActive ? 'inline-flex' : 'none';

  // Upgrade banner (solo free)
  const banner = document.getElementById('upgradeBanner');
  if (banner) banner.style.display = isPro ? 'none' : 'flex';

  // Limit bar (solo free)
  updateLimitBar(user);
}

async function updateLimitBar(user) {
  const plan = user?.plan || 'free';
  const isPro = plan === 'pro';
  const wrap = document.getElementById('limitBarWrap');
  if (!wrap) return;
  if (isPro) { wrap.style.display = 'none'; return; }

  const limit = PLAN_LIMITS.free.eventsPerMonth;
  const count = await panelApi.getMonthlyEventCount(user).catch(()=>0);
  wrap.style.display = 'block';
  document.getElementById('limitBarText').textContent = `${count} / ${limit}`;
  const pct = Math.min(100, (count/limit)*100);
  const fill = document.getElementById('limitBarFill');
  fill.style.width = pct + '%';
  fill.className = 'limit-bar-fill' + (pct >= 100 ? ' full' : pct >= 80 ? ' warn' : '');
}

function openUpgradeModal() {
  document.getElementById('upgradeModal').classList.add('active');
}
function closeUpgradeModal() {
  document.getElementById('upgradeModal').classList.remove('active');
}

/* ─── OVERRIDE handleSaveEvent to pass user ─── */
const _origHandleSaveEvent = handleSaveEvent;
async function handleSaveEvent(e){
  e.preventDefault();
  const id = document.getElementById('eventId').value;
  const date = document.getElementById('eventDate').value;
  const time = document.getElementById('eventTime').value;
  const ev = {
    name: document.getElementById('eventName').value,
    datetime: `${date}T${time}:00`,
    service: document.getElementById('eventService').value,
    phone: document.getElementById('eventPhone').value,
    notes: document.getElementById('eventNotes').value,
    source: 'manual',
    status: 'confirmed'
  };
  if (id) ev.id = id;
  try {
    await panelApi.saveEvent(ev, currentPanelUser);
    closeEventModal();
    renderCalendar();
    loadPanelData();
    updateLimitBar(currentPanelUser);
    showPanelToast(id ? 'Reserva actualizada' : 'Reserva creada', 'success');
  } catch(err) {
    if (err.message.includes('límite')) {
      closeEventModal();
      openUpgradeModal();
    }
    showPanelToast(err.message, 'error');
  }
}

/* ─── OVERRIDE enterPanelDashboard to pass user to plan UI ─── */
const _origEnterDash = enterPanelDashboard;
function enterPanelDashboard(user){
  _origEnterDash(user);
  updatePlanUI(user);
}
</script>
