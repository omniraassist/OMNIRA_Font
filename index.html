<style>
  :root {
    --em: #00E096;
    --em-dim: #00C47A;
    --em-glow: rgba(0,224,150,0.18);
    --em-glow2: rgba(0,224,150,0.08);
    --ink: #080B0F;
    --ink2: #0D1117;
    --ink3: #111820;
    --surf: #141B24;
    --surf2: #1A2330;
    --border: rgba(255,255,255,0.07);
    --border-em: rgba(0,224,150,0.2);
    --muted: #6B7A8D;
    --soft: #A8B4C0;
    --text: #E8EDF2;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ink);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { font-family: 'Playfair Display', serif; }

  /* ── UTILITIES ── */
  .em { color: var(--em); }
  .muted { color: var(--muted); }
  .soft { color: var(--soft); }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 28px; }
  .gradient-text {
    background: linear-gradient(135deg, #fff 0%, var(--em) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .card {
    background: rgba(20,27,36,0.65);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .card-em {
    background: rgba(20,27,36,0.65);
    border: 1px solid var(--border-em);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 13px 26px; border-radius: 100px;
    background: linear-gradient(90deg, var(--em) 0%, #a8f0d0 50%, var(--em) 100%);
    background-size: 200% auto;
    animation: shimmer 3s linear infinite;
    color: var(--ink); font-weight: 600; font-size: 14px;
    border: none; cursor: pointer; text-decoration: none;
    transition: transform .25s, box-shadow .25s;
  }
  .btn-primary:hover { transform: scale(1.04); box-shadow: 0 0 30px var(--em-glow); }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 13px 26px; border-radius: 100px;
    background: transparent; color: var(--text);

    cursor: pointer; text-decoration: none;
    transition: border-color .25s, background .25s, transform .25s;

  .btn-outline:hover { border-color: var(--border-em); background: var(--em-glow2); transform: scale(1.02); }
  .section-label {

  }

  .star-row { display: flex; gap: 2px; }

  /* ── KEYFRAMES ── */

  .stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; }

  /* ── SOLUTION ── */
  #solucion { padding: 96px 0; background: var(--ink2); position: relative; }
  .sol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .sol-feature {

  /* ── BENEFITS ── */

<script>
  // Pricing tab switch — highlight active tab, all cards always visible
  function switchPlan(plan, btn) {
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    // Highlight the corresponding card with a subtle ring
    document.querySelectorAll('.plan-card').forEach(c => {
      c.style.outline = 'none';
      c.style.outlineOffset = '0';
    });
    const target = document.getElementById('plan-' + plan);
    if (target) {
      target.style.outline = '2px solid rgba(0,224,150,0.5)';
      target.style.outlineOffset = '3px';
      target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
    // Clear highlight after 1.8s
    setTimeout(() => {
      if (target) { target.style.outline = 'none'; }
    }, 1800);
  }

  // Navbar scroll effect
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 40);
  });

  // Mobile menu
  function toggleMenu() {
    document.getElementById('mobile-menu').classList.toggle('open');
  }
  function closeMenu() {
    document.getElementById('mobile-menu').classList.remove('open');
  }

  // Scroll reveal
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
  }, { threshold: 0.12 });
  reveals.forEach(el => observer.observe(el));

  // Chat animation
  const messages = [
    { from: 'client', text: 'Hola, ¿tenéis hueco esta semana?' },
    { from: 'bot',    text: '¡Hola! Claro 😊 ¿Para qué servicio te gustaría reservar?' },
    { from: 'client', text: 'Limpieza facial y masaje de espalda' },
    { from: 'bot',    text: 'Perfecto. Tengo disponible el jueves 24 a las 17:00h. ¿Te va bien?' },
    { from: 'client', text: '¡Sí, perfecto!' },
    { from: 'bot',    text: '✅ ¡Cita confirmada! Te esperamos el jueves 24 a las 17:00h. Recibirás un recordatorio 24h antes.' },
  ];
  const chatBody = document.getElementById('chat-body');
  let idx = 0;
  function addMessage() {
    if (idx >= messages.length) { setTimeout(() => { chatBody.innerHTML=''; idx=0; setTimeout(addMessage,800); }, 3000); return; }
    const m = messages[idx++];
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap' + (m.from==='client' ? ' right' : '');
    const bubble = document.createElement('div');
    bubble.className = m.from==='client' ? 'bubble-client' : 'bubble-bot';
    bubble.textContent = m.text;
    bubble.style.opacity = '0';
    bubble.style.transform = 'translateY(8px)';
    bubble.style.transition = 'all .35s ease';
    wrap.appendChild(bubble);
    chatBody.appendChild(wrap);
    chatBody.scrollTop = chatBody.scrollHeight;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bubble.style.opacity = '1';
      bubble.style.transform = 'translateY(0)';
    }));
    setTimeout(addMessage, 900 + Math.random()*400);
  }
  setTimeout(addMessage, 1200);
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   API CLIENT — Omnira Panel del Cliente
   ─────────────────────────────────────────────────────────────
   Prepara toda la comunicación con el backend del programador
   para vinculación con el Master Admin Dashboard.

   PARA ACTIVAR EL BACKEND REAL: cambiar API_BASE por la URL del servidor.
   Mientras esté vacío, todo funciona en modo demo con localStorage.

   ENDPOINTS QUE EL PROGRAMADOR DEBE IMPLEMENTAR EN EL BACKEND:
   ─────────────────────────────────────────────────────────────
   AUTH:
     POST   /api/auth/register      → { user, token } — crea registro en admin
     POST   /api/auth/login         → { user, token }
     POST   /api/auth/logout
     GET    /api/auth/me            → { user } — re-validar sesión al volver

   DATOS DEL CLIENTE:
     GET    /api/dashboard          → { stats, recentReservations, recentConversations, botStatus, plan }
     GET    /api/business           → datos del negocio
     PUT    /api/business           → actualizar (sincroniza con Knowledge Base del bot)
     GET    /api/bot                → config del bot
     PUT    /api/bot                → actualizar config

   CALENDARIO Y RESERVAS:
     GET    /api/events?from=&to=   → todas las citas (fuente: bot o manual)
     POST   /api/events             → crear cita manual
     PUT    /api/events/:id         → actualizar cita
     DELETE /api/events/:id         → eliminar cita
     POST   /api/events/sync        → forzar sync con Google Calendar (futuro)

   CONVERSACIONES:
     GET    /api/conversations      → mensajes WhatsApp
     GET    /api/conversations/:id/messages

   FACTURACIÓN (Stripe):
     GET    /api/billing            → plan, próximo cobro, método de pago
     POST   /api/billing/portal     → URL al Stripe Customer Portal

   IMPORTANTE PARA EL ADMIN PANEL:
   ─────────────────────────────────────────────────────────────
   - Cuando un cliente se REGISTRA aquí → debe crear automáticamente
     un registro en el Master Admin con status 'pending_setup'
   - Cuando el cliente PAGA en Stripe → status pasa a 'active'
     y se activa el bot en Twilio (webhook Stripe)
   - Cuando el cliente CANCELA → status pasa a 'cancelled'
     y se desactiva el bot
   - El admin puede ver/gestionar clientes desde el panel maestro
     accediendo a esta misma base de datos
   ═══════════════════════════════════════════════════════════ */

const API_BASE = ''; // ← Cambiar por la URL del backend (ej: 'https://api.omnira.io')

const panelApi = {
  // ─── AUTH ───
  async register(data) {
    if (!API_BASE) {
      const users = JSON.parse(localStorage.getItem('omnira_users')||'[]');
      if (users.find(u => u.email.toLowerCase() === data.email.toLowerCase()))
        throw new Error('Ese email ya está registrado. ¿Quieres iniciar sesión?');
      const user = {
        id: 'user_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
        businessName: data.businessName,
        email: data.email.toLowerCase().trim(),
        phone: data.phone,
        password: data.password, // En producción hasheado en backend
        status: 'pending_setup',
        plan: null,
        botActive: false,
        createdAt: new Date().toISOString()
      };
      users.push(user);
      localStorage.setItem('omnira_users', JSON.stringify(users));
      return { user: this._publicUser(user), token: 'demo-'+user.id };
    }
    const res = await fetch(`${API_BASE}/api/auth/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.message || 'Error al crear cuenta');
    }
    return res.json();
  },

  async login(email, password) {
    if (!API_BASE) {
      const users = JSON.parse(localStorage.getItem('omnira_users')||'[]');
      const normalized = email.toLowerCase().trim();
      const user = users.find(u =>
        u.email.toLowerCase() === normalized && u.password === password
      );
      if (!user) {
        // Mensaje claro: distingue email no existe vs contraseña incorrecta
        const exists = users.find(u => u.email.toLowerCase() === normalized);
        if (!exists) throw new Error('No existe ninguna cuenta con ese email.');
        throw new Error('Contraseña incorrecta.');
      }
      return { user: this._publicUser(user), token: 'demo-'+user.id };
    }
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email,password})
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.message || 'Email o contraseña incorrectos');
    }
    return res.json();
  },

  async getMe() {
    // Re-valida la sesión al volver — útil para detectar tokens caducados
    if (!API_BASE) {
      const session = JSON.parse(localStorage.getItem('omnira_session')||'{}');
      if (!session.user) throw new Error('No hay sesión');
      // Verificar que el usuario todavía existe en localStorage (modo demo)
      const users = JSON.parse(localStorage.getItem('omnira_users')||'[]');
      const fresh = users.find(u => u.id === session.user.id);
      if (!fresh) throw new Error('Sesión inválida');
      return { user: this._publicUser(fresh) };
    }
    const res = await fetch(`${API_BASE}/api/auth/me`, { headers: this._h() });
    if (!res.ok) throw new Error('Sesión expirada');
    return res.json();
  },

  async logout() {
    localStorage.removeItem('omnira_session');
    if (API_BASE) {
      try { await fetch(`${API_BASE}/api/auth/logout`,{method:'POST',headers:this._h()}); } catch(e){}
    }
  },

  // ─── DASHBOARD ───
  async getDashboard() {
    if (!API_BASE) {
      const events = this._localEvents();
      const now = new Date();
      const month = now.getMonth();
      const year = now.getFullYear();
      const reservasMes = events.filter(e => {
        const d = new Date(e.datetime);
        return d.getMonth() === month && d.getFullYear() === year;
      }).length;
      return {
        stats: {
          reservas: reservasMes,
          mensajes: 0,
          respuesta: '2s',
          valoracion: '4.9'
        },
        recentReservations: events
          .filter(e => new Date(e.datetime) >= new Date())
          .sort((a,b) => new Date(a.datetime) - new Date(b.datetime))
          .slice(0,4),
        recentConversations: [],
        botStatus: 'active',
        plan: { name: 'Mensual', price: 99, currency: 'EUR' }
      };
    }
    const res = await fetch(`${API_BASE}/api/dashboard`,{headers:this._h()});
    return res.json();
  },

  // ─── CALENDARIO Y RESERVAS ───
  async getEvents(filters={}) {
    if (!API_BASE) return this._localEvents();
    const params = new URLSearchParams(filters);
    const res = await fetch(`${API_BASE}/api/events?${params}`,{headers:this._h()});
    return res.json();
  },
  async saveEvent(ev) {
    if (!API_BASE) {
      const all = this._localEvents();
      if (ev.id) {
        const idx = all.findIndex(e => e.id === ev.id);
        if (idx >= 0) all[idx] = { ...all[idx], ...ev, updatedAt: new Date().toISOString() };
      } else {
        ev.id = 'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        ev.source = ev.source || 'manual';
        ev.status = ev.status || 'confirmed';
        ev.createdAt = new Date().toISOString();
        all.push(ev);
      }
      localStorage.setItem('omnira_events_'+this._uid(), JSON.stringify(all));
      return ev;
    }
    const method = ev.id ? 'PUT' : 'POST';
    const url = ev.id ? `${API_BASE}/api/events/${ev.id}` : `${API_BASE}/api/events`;
    const res = await fetch(url,{method,headers:this._h(),body:JSON.stringify(ev)});
    if (!res.ok) throw new Error('Error al guardar la cita');
    return res.json();
  },
  async deleteEvent(id) {
    if (!API_BASE) {
      const all = this._localEvents().filter(e => e.id !== id);
      localStorage.setItem('omnira_events_'+this._uid(), JSON.stringify(all));
      return { success:true };
    }
    const res = await fetch(`${API_BASE}/api/events/${id}`,{method:'DELETE',headers:this._h()});
    if (!res.ok) throw new Error('Error al eliminar la cita');
    return res.json();
  },

  // ─── DATOS DEL NEGOCIO ───
  async getBusiness() {
    if (!API_BASE) return JSON.parse(localStorage.getItem('omnira_business_'+this._uid())||'{}');
    const res = await fetch(`${API_BASE}/api/business`,{headers:this._h()});
    return res.json();
  },
  async saveBusiness(data) {
    if (!API_BASE) {
      localStorage.setItem('omnira_business_'+this._uid(), JSON.stringify({
        ...data, updatedAt: new Date().toISOString()
      }));
      return { success:true };
    }
    const res = await fetch(`${API_BASE}/api/business`,{
      method:'PUT', headers:this._h(), body:JSON.stringify(data)
    });
    if (!res.ok) throw new Error('Error al guardar los datos del negocio');
    return res.json();
  },

  // ─── CONFIG DEL BOT ───
  async getBot() {
    if (!API_BASE) return JSON.parse(localStorage.getItem('omnira_bot_'+this._uid())||'{}');
    const res = await fetch(`${API_BASE}/api/bot`,{headers:this._h()});
    return res.json();
  },
  async saveBot(data) {
    if (!API_BASE) {
      localStorage.setItem('omnira_bot_'+this._uid(), JSON.stringify({
        ...data, updatedAt: new Date().toISOString()
      }));
      return { success:true };
    }
    const res = await fetch(`${API_BASE}/api/bot`,{
      method:'PUT', headers:this._h(), body:JSON.stringify(data)
    });
    if (!res.ok) throw new Error('Error al guardar la configuración del bot');
    return res.json();
  },

  // ─── CONVERSACIONES ───
  async getConversations() {
    if (!API_BASE) return [];
    const res = await fetch(`${API_BASE}/api/conversations`,{headers:this._h()});
    return res.json();
  },

  // ─── FACTURACIÓN (Stripe) ───
  async getBilling() {
    if (!API_BASE) {
      const next = new Date();
      next.setMonth(next.getMonth() + 1);
      return {
        plan: { name: 'Mensual', price: 99, currency: 'EUR' },
        nextBillingDate: next.toISOString(),
        paymentMethod: { last4: '0000', brand: 'visa' },
        invoices: []
      };
    }
    const res = await fetch(`${API_BASE}/api/billing`,{headers:this._h()});
    return res.json();
  },
  async getBillingPortalUrl() {
    if (!API_BASE) return { url: '#' };
    const res = await fetch(`${API_BASE}/api/billing/portal`,{
      method:'POST', headers:this._h()
    });
    return res.json();
  },

  // ─── HELPERS PRIVADOS ───
  _h() {
    const s = JSON.parse(localStorage.getItem('omnira_session')||'{}');
    return {'Content-Type':'application/json','Authorization':`Bearer ${s.token||''}`};
  },
  _uid() {
    const s = JSON.parse(localStorage.getItem('omnira_session')||'{}');
    return s.user?.id || 'anon';
  },
  _localEvents() {
    return JSON.parse(localStorage.getItem('omnira_events_'+this._uid())||'[]');
  },
  _publicUser(u) {
    // Devuelve solo los campos públicos (sin password)
    const { password, ...pub } = u;
    return pub;
  }
};

/* ─── PANEL OPEN/CLOSE ─── */
async function openClientPanel(view){
  document.getElementById('clientPanel').classList.add('active');
  document.body.style.overflow = 'hidden';

  // Si hay sesión guardada, validarla antes de entrar al dashboard
  const session = localStorage.getItem('omnira_session');
  if (session) {
    try {
      const data = JSON.parse(session);
      if (data.user && data.token) {
        // Re-validar contra el backend (o localStorage en modo demo)
        try {
          const fresh = await panelApi.getMe();
          // Actualizar datos del usuario con los más recientes
          localStorage.setItem('omnira_session', JSON.stringify({
            user: fresh.user, token: data.token
          }));
          enterPanelDashboard(fresh.user);
          return;
        } catch(err) {
          // Sesión inválida o expirada — limpiar y mostrar login
          localStorage.removeItem('omnira_session');
        }
      }
    } catch(e){}
  }

  if (view === 'register') showPanelRegister();
  else showPanelLogin();
}
function closeClientPanel(){
  document.getElementById('clientPanel').classList.remove('active');
  document.body.style.overflow = '';
}

/* ─── AUTH ─── */
function showPanelRegister(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('registerScreen').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('active');
}
function showPanelLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('registerScreen').style.display = 'none';
  document.getElementById('dashboard').classList.remove('active');
}
async function handlePanelLogin(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('loginError');
  errBox.classList.remove('visible');
  btn.disabled = true; const orig = btn.innerHTML;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div>';
  try {
    const result = await panelApi.login(
      document.getElementById('loginEmail').value,
      document.getElementById('loginPassword').value
    );
    localStorage.setItem('omnira_session', JSON.stringify(result));
    if (typeof fbq !== 'undefined') fbq('track','Login');
    enterPanelDashboard(result.user);
  } catch(err) {
    errBox.textContent = err.message;
    errBox.classList.add('visible');
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}
async function handlePanelRegister(e){
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const errBox = document.getElementById('registerError');
  errBox.classList.remove('visible');
  btn.disabled = true; const orig = btn.innerHTML;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div>';
  try {
    const data = {
      businessName: document.getElementById('regBusiness').value,
      email: document.getElementById('regEmail').value,
      phone: document.getElementById('regPhone').value,
      password: document.getElementById('regPassword').value
    };
    const result = await panelApi.register(data);
    localStorage.setItem('omnira_session', JSON.stringify(result));
    if (typeof fbq !== 'undefined') fbq('track','CompleteRegistration');
    enterPanelDashboard(result.user);
  } catch(err) {
    errBox.textContent = err.message;
    errBox.classList.add('visible');
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}
async function handlePanelLogout(){
  await panelApi.logout();
  document.getElementById('dashboard').classList.remove('active');
  showPanelLogin();
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

/* ─── DASHBOARD ─── */
function enterPanelDashboard(user){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('registerScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  const name = user.businessName || user.name || 'Cliente';
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('userName').textContent = name;
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('welcomeTitle').innerHTML = `Hola, <span class="em">${name}</span>`;
  loadPanelData();
  renderCalendar();
}
async function loadPanelData(){
  try {
    const data = await panelApi.getDashboard();
    document.getElementById('statReservas').textContent = data.stats.reservas || 0;
    document.getElementById('statMensajes').textContent = data.stats.mensajes || 0;
    document.getElementById('statRespuesta').textContent = data.stats.respuesta || '2s';
    if (data.recentReservations?.length) renderResList('recentReservations', data.recentReservations.slice(0,4));
    if (data.recentConversations?.length) renderConvList('recentConversations', data.recentConversations.slice(0,4));
    renderResList('allReservations', data.recentReservations || []);
  } catch(err) { console.error('Dashboard error:', err); }

  try {
    const biz = await panelApi.getBusiness();
    ['Name','Type','Phone','Email','Address','Hours','Services','Cancel'].forEach(k=>{
      const v = biz[k.toLowerCase()] || biz[k.toLowerCase()==='cancel'?'cancellation':k.toLowerCase()];
      const el = document.getElementById('biz'+k);
      if (el && v) el.value = v;
    });
  } catch(err){}

  try {
    const bot = await panelApi.getBot();
    if (bot.greeting) document.getElementById('botGreeting').value = bot.greeting;
    if (bot.instructions) document.getElementById('botInstructions').value = bot.instructions;
  } catch(err){}

  const next = new Date();
  next.setMonth(next.getMonth() + 1);
  document.getElementById('nextBilling').textContent = next.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
}
function renderResList(id, list){
  if (!list.length) return;
  document.getElementById(id).innerHTML = list.map(r => {
    const dt = new Date(r.datetime || r.date);
    const fecha = dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    const hora = dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    return `<div class="res-item">
      <div class="res-avatar">${(r.name||'?')[0]}</div>
      <div class="res-info">
        <div class="res-name">${r.name||'Cliente'}</div>
        <div class="res-detail">${r.service||''} · ${fecha} ${hora}</div>
      </div>
      <span class="res-status ${r.status||'confirmed'}">${r.status==='pending'?'Pendiente':r.status==='cancelled'?'Cancelada':'Confirmada'}</span>
    </div>`;
  }).join('');
}
function renderConvList(id, list){
  if (!list.length) return;
  document.getElementById(id).innerHTML = list.map(c => `
    <div class="conv-item">
      <div class="conv-avatar">${(c.name||'?')[0]}</div>
      <div class="conv-info">
        <div class="conv-name">${c.name||'Cliente'}</div>
        <div class="conv-msg">${c.lastMessage||''}</div>
      </div>
      <div class="conv-time">${c.time||''}</div>
    </div>`).join('');
}

/* ─── NAVIGATION ─── */
function showPanelSection(name, btn){
  document.querySelectorAll('#clientPanel .page-section').forEach(s => s.classList.remove('active'));
  document.getElementById('section-'+name).classList.add('active');

    .find(b => b.getAttribute('onclick')?.includes(`'${name}'`));

}

/* ─── CALENDAR ─── */
let calCurrent = new Date();
calCurrent.setDate(1);

const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

async function renderCalendar(){
  const year = calCurrent.getFullYear();
  const month = calCurrent.getMonth();
  document.getElementById('calMonth').textContent = `${MONTHS_ES[month]} ${year}`;

  const events = await panelApi.getEvents();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Primer día del mes (lunes=0, ..., domingo=6)
  const firstDay = new Date(year, month, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();

  // Días vacíos del mes anterior
  for (let i=0; i<offset; i++) {
    const div = document.createElement('div');
    div.className = 'cal-day empty';
    grid.appendChild(div);
  }
  // Días del mes
  for (let d=1; d<=daysInMonth; d++) {
    const div = document.createElement('div');
    div.className = 'cal-day';
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
    if (isToday) div.classList.add('today');

    const dayEvents = events.filter(e => {
      const ed = new Date(e.datetime);
      return ed.getFullYear()===year && ed.getMonth()===month && ed.getDate()===d;
    });
    if (dayEvents.length) div.classList.add('has-events');

    let html = `<div class="cal-day-num">${d}</div>`;
    html += '<div class="cal-events">';
    const visible = dayEvents.slice(0,2);
    visible.forEach(e => {
      const time = new Date(e.datetime).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      const cls = e.source === 'manual' ? 'manual' : 'bot';
      html += `<div class="cal-event ${cls}" data-event-id="${e.id}">${time} ${escapeHtml(e.name)}</div>`;
    });
    if (dayEvents.length > 2) html += `<div class="cal-event-more">+${dayEvents.length-2} más</div>`;
    html += '</div>';
    div.innerHTML = html;

    div.addEventListener('click', (ev) => {
      const target = ev.target.closest('.cal-event');
      if (target && target.dataset.eventId) {
        const found = events.find(x => x.id === target.dataset.eventId);
        if (found) openEditEventModal(found);
      } else {
        openAddEventModal(dateStr);
      }
    });
    grid.appendChild(div);
  }
}
function changeCalMonth(delta){
  calCurrent.setMonth(calCurrent.getMonth() + delta);
  renderCalendar();
}
function goToToday(){
  calCurrent = new Date();
  calCurrent.setDate(1);
  renderCalendar();
}

/* ─── EVENT MODAL ─── */
function openAddEventModal(dateStr){
  document.getElementById('eventModalTitle').textContent = 'Nueva reserva';
  document.getElementById('eventForm').reset();
  document.getElementById('eventId').value = '';
  document.getElementById('eventDeleteBtn').style.display = 'none';
  if (dateStr) document.getElementById('eventDate').value = dateStr;
  else {
    const t = new Date();
    document.getElementById('eventDate').value = t.toISOString().split('T')[0];
  }
  document.getElementById('eventTime').value = '10:00';
  document.getElementById('eventModal').classList.add('active');
}
function openEditEventModal(ev){
  document.getElementById('eventModalTitle').textContent = 'Editar reserva';
  document.getElementById('eventId').value = ev.id;
  document.getElementById('eventName').value = ev.name || '';
  const dt = new Date(ev.datetime);
  document.getElementById('eventDate').value = dt.toISOString().split('T')[0];
  document.getElementById('eventTime').value = dt.toTimeString().slice(0,5);
  document.getElementById('eventService').value = ev.service || '';
  document.getElementById('eventPhone').value = ev.phone || '';
  document.getElementById('eventNotes').value = ev.notes || '';
  document.getElementById('eventDeleteBtn').style.display = ev.source === 'manual' ? 'block' : 'none';
  document.getElementById('eventModal').classList.add('active');
}
function closeEventModal(){
  document.getElementById('eventModal').classList.remove('active');
}
async function handleSaveEvent(e){
  e.preventDefault();
  const id = document.getElementById('eventId').value;
  const date = document.getElementById('eventDate').value;
  const time = document.getElementById('eventTime').value;
  const ev = {
    name: document.getElementById('eventName').value,
    datetime: `${date}T${time}:00`,
    service: document.getElementById('eventService').value,
    phone: document.getElementById('eventPhone').value,
    notes: document.getElementById('eventNotes').value,
    source: 'manual',
    status: 'confirmed'
  };
  if (id) ev.id = id;
  try {
    await panelApi.saveEvent(ev);
    closeEventModal();
    renderCalendar();
    loadPanelData();
    showPanelToast(id?'Reserva actualizada':'Reserva creada','success');
  } catch(err) {
    showPanelToast('Error: '+err.message,'error');
  }
}
async function handleDeleteEvent(){
  const id = document.getElementById('eventId').value;
  if (!id) return;
  if (!confirm('¿Eliminar esta reserva?')) return;
  try {
    await panelApi.deleteEvent(id);
    closeEventModal();
    renderCalendar();
    loadPanelData();
    showPanelToast('Reserva eliminada','success');
  } catch(err) {
    showPanelToast('Error: '+err.message,'error');
  }
}

/* ─── HELPERS ─── */
function showPanelToast(message, type='success'){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast '+type;
  setTimeout(()=>toast.classList.add('visible'), 10);
  setTimeout(()=>toast.classList.remove('visible'), 3500);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ─── DEEP LINKING: ?panel=login o ?panel=register ─── */
(function checkPanelDeepLink(){
  const params = new URLSearchParams(window.location.search);
  const panel = params.get('panel');
  if (panel === 'login' || panel === 'register') {
    setTimeout(() => openClientPanel(panel), 100);
  }
})();
