<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&amp;display=swap');</style>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f7ef"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="240" height="80" fill="#070f09" rx="14"/>

  <!-- Icon container: rounded square -->
  <rect x="10" y="10" width="60" height="60" rx="15" fill="#0c1f14"/>
  <rect x="10" y="10" width="60" height="60" rx="15" stroke="#00e5a0" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Neural triangle icon -->
  <!-- Triangle outer edges (connecting 3 nodes) -->
  <line x1="40" y1="24" x2="54" y2="48" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="54" y1="48" x2="26" y2="48" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="26" y1="48" x2="40" y2="24" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Arms from center to each node -->
  <line x1="40" y1="40" x2="40" y2="24" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="40" y1="40" x2="54" y2="48" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="40" y1="40" x2="26" y2="48" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Outer nodes -->
  <circle cx="40" cy="24" r="3.5" fill="#00e5a0" filter="url(#glow)"/>
  <circle cx="54" cy="48" r="3.5" fill="#00e5a0" filter="url(#glow)"/>
  <circle cx="26" cy="48" r="3.5" fill="#00e5a0" filter="url(#glow)"/>

  <!-- Center node (larger, brightest) -->
  <circle cx="40" cy="40" r="5" fill="#00e5a0" filter="url(#glowStrong)"/>
  <circle cx="40" cy="40" r="2.5" fill="#ffffff"/>

  <!-- Wordmark: omnira -->
  <text x="84" y="50"
    font-family="'Outfit', 'Inter', 'Helvetica Neue', sans-serif"
    font-size="28"
    font-weight="500"
    fill="#ffffff"
    letter-spacing="1"
    opacity="0.95">omnira</text>
</svg>
