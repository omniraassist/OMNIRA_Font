<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="80" height="80" fill="#070f09" rx="18"/>
  <rect width="80" height="80" fill="none" stroke="#00e5a0" stroke-width="1.5" rx="18" opacity="0.25"/>

  <!-- Triangle outer edges -->
  <line x1="40" y1="18" x2="59" y2="52" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="59" y1="52" x2="21" y2="52" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="21" y1="52" x2="40" y2="18" stroke="#00e5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Arms from center -->
  <line x1="40" y1="40" x2="40" y2="18" stroke="#00e5a0" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="40" y1="40" x2="59" y2="52" stroke="#00e5a0" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="40" y1="40" x2="21" y2="52" stroke="#00e5a0" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Outer nodes -->
  <circle cx="40" cy="18" r="4.5" fill="#00e5a0" filter="url(#glow)"/>
  <circle cx="59" cy="52" r="4.5" fill="#00e5a0" filter="url(#glow)"/>
  <circle cx="21" cy="52" r="4.5" fill="#00e5a0" filter="url(#glow)"/>

  <!-- Center node -->
  <circle cx="40" cy="40" r="7" fill="#00e5a0" filter="url(#glowStrong)"/>
  <circle cx="40" cy="40" r="3.5" fill="#ffffff"/>
</svg>
